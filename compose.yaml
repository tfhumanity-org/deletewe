# Self-hosted deletewe, the short version.
#
#   docker compose up --build
#   open http://localhost:8787
#
# The encryption key is generated into ./data/keys.json on first boot.
# Back it up. Losing it makes every stored record permanently unreadable —
# that is what encryption means, and it is the point.

services:
  deletewe:
    build: .
    ports:
      - '8787:8787'
    volumes:
      - ./data:/data
    environment:
      DELETEWE_DATA_DIR: /data
      DELETEWE_BASE_URL: http://localhost:8787
      DELETEWE_LOG_LEVEL: info
      # Inbound confirmation links are what actually complete most opt-outs.
      # Point this at a domain you control and route its mail into
      # /data/maildrop as .eml files.
      DELETEWE_INBOUND_DOMAIN: localhost
      # Disclosed in a member's DROP account as their authorized agent
      # (Cal. Code Regs. tit. 11 § 7621(b)). Leave unset and members submit in
      # their own name, which works identically.
      # DELETEWE_DROP_AGENT_NAME: Your Name
      # DELETEWE_DROP_AGENT_EMAIL: you@example.com
      # DELETEWE_DROP_AGENT_TRADE_NAME: Your Business
      # Outbound mail goes to /data/outbox as files until you set these.
      # DELETEWE_MAIL_ENDPOINT: https://api.your-provider.example/emails
      # DELETEWE_MAIL_API_KEY: ...
    restart: unless-stopped

  # A stand-in data broker for trying the system out without touching a real
  # site. Not started by default.
  mock-broker:
    build: .
    command: ['node', 'apps/mock-broker/dist/main.js']
    ports:
      - '8788:8788'
    environment:
      PORT: 8788
    profiles: ['demo']
