# Nuwber
#
# UNVERIFIED. Authored from public opt-out documentation; never executed
# against the live site. Treat every selector as theoretical until someone
# runs it and sets `verified_at`. See docs/broker-catalog.md section 6.

id: nuwber
name: "Nuwber"
homepage: https://nuwber.com
version: 1.0.0
category: people_search
jurisdictions:
  - US
hosts:
  - nuwber.com
  - www.nuwber.com

automation:
  level: automated

search:
  method: url_template
  url_template: "https://nuwber.com/search?name={name_slug}"
  result_selector: ".person-card"
  fields:
    name: { selector: ".person-name", attr: text }
    locality: { selector: ".person-location", attr: text }
    region: { selector: ".person-region", attr: text }
    age: { selector: ".person-age", attr: text }
    url: { selector: "a.person-link", attr: href }

match:
  fields:
    name: 0.4
    locality: 0.2
    region: 0.15
    age: 0.25
  thresholds:
    review: 0.5
    auto_confirm: 0.92
  require_manual_confirmation: false

opt_out:
  method: form
  url: https://nuwber.com/removal/link
  required_fields:
    - listing_url
    - email
  steps:
    - id: open
      action: goto
      url: "https://nuwber.com/removal/link"
      expect: { selector_present: "form" }
    - id: listing-url
      action: fill
      selector: "input[name=\"url\"]"
      value: "{{listing_url}}"
    - id: email
      action: fill
      selector: "input[name=\"email\"]"
      value: "{{email}}"
    - id: submit
      action: click
      selector: "button[type=\"submit\"]"
      expect: { text_contains: "request" }

verification:
  method: email_link
  expected_senders:
    - "@nuwber.com"
  link_pattern: "https://nuwber\\.com/[A-Za-z0-9_/-]*(?:confirm|optout|removal|opt-out)[A-Za-z0-9_/-]*"
  window_hours: 24

relist:
  interval_days: 90

rate_limit:
  max_concurrent: 1
  min_interval_ms: 4000
  daily_cap: 200

references:
  - https://nuwber.com/removal/link
