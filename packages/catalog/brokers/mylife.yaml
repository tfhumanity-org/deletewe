# MyLife
#
# UNVERIFIED. Authored from public opt-out documentation; never executed
# against the live site. Treat every selector as theoretical until someone
# runs it and sets `verified_at`. See docs/broker-catalog.md section 6.

id: mylife
name: "MyLife"
homepage: https://www.mylife.com
version: 1.0.0
category: people_search
jurisdictions:
  - US
hosts:
  - www.mylife.com
  - mylife.com

automation:
  level: automated

search:
  method: url_template
  url_template: "https://www.mylife.com/{name_slug}"
  result_selector: ".search-result"
  fields:
    name: { selector: ".result-name", attr: text }
    locality: { selector: ".result-city", attr: text }
    region: { selector: ".result-state", attr: text }
    age: { selector: ".result-age", attr: text }
    url: { selector: "a", attr: href }

match:
  fields:
    name: 0.45
    locality: 0.2
    region: 0.15
    age: 0.2
  thresholds:
    review: 0.5
    auto_confirm: 0.92
  require_manual_confirmation: false

opt_out:
  method: email
  required_fields:
    - full_name
    - address
    - city
    - region
    - postal_code
    - email
    - jurisdiction
  email:
    to: privacy@mylife.com
    subject_template: "Authorized agent deletion request for {{full_name}}"
    body_template: |
      To whom it may concern,

      I am writing as the authorized agent of {{full_name}}, acting on their explicit
      written instruction, to request the deletion of their personal information and
      to opt them out of its sale or sharing.

        Name:     {{full_name}}
        Address:  {{address}}, {{city}}, {{region}} {{postal_code}}
        Email:    {{email}}

      This request is made under the California Consumer Privacy Act as amended by
      the California Privacy Rights Act, and under any other privacy law applicable
      to this individual in {{jurisdiction}}.

      Please confirm in writing once the information has been deleted and suppressed
      from future collection. A signed authorization is available on request.

      Sent on behalf of the above individual by deletewe, acting as authorized agent.

verification:
  method: none
  window_hours: 72

relist:
  interval_days: 90

rate_limit:
  max_concurrent: 1
  min_interval_ms: 4000
  daily_cap: 200

references:
  - https://www.mylife.com/ccpa/index.pubview

notes: |
  Email-based requests are the one method we can fully automate end to end: no
  rendering, no CAPTCHA, and a durable record of exactly what was sent.
