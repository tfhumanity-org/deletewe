# Radaris
#
# UNVERIFIED. Authored from public opt-out documentation; never executed
# against the live site. Treat every selector as theoretical until someone
# runs it and sets `verified_at`. See docs/broker-catalog.md section 6.

id: radaris
name: "Radaris"
homepage: https://radaris.com
version: 1.0.0
category: people_search
jurisdictions:
  - US
hosts:
  - radaris.com
  - www.radaris.com

automation:
  level: assisted
  reason: "Managing a listing requires creating an account with the broker"

search:
  method: url_template
  url_template: "https://radaris.com/p/{name_slug}/"
  result_selector: ".search-results .person"
  fields:
    name: { selector: ".person-name", attr: text }
    locality: { selector: ".person-city", attr: text }
    region: { selector: ".person-state", attr: text }
    age: { selector: ".person-age", attr: text }
    url: { selector: "a", attr: href }

match:
  fields:
    name: 0.4
    locality: 0.2
    region: 0.15
    age: 0.25
  thresholds:
    review: 0.5
    auto_confirm: 0.92
  require_manual_confirmation: false

opt_out:
  method: account
  url: https://radaris.com/control/privacy
  required_fields:
    - listing_url
    - email
    - full_name
  instructions: |
    Radaris requires an account before it will let anyone manage a listing.
    Our mandate covers creating one on your behalf, but doing so from an
    automated session would look like exactly the behaviour their controls
    exist to stop, so this one is yours.

    Open this listing: {{listing_url}}
    Register or sign in as {{email}}, claim the record for {{full_name}},
    then use "Control Information" to remove it.

verification:
  method: account_login
  window_hours: 72

relist:
  interval_days: 60

rate_limit:
  max_concurrent: 1
  min_interval_ms: 4000
  daily_cap: 200

references:
  - https://radaris.com/control/privacy
  - https://omlumi.com/guides/how-to-remove-yourself-from-people-search-sites

notes: |
  Radaris re-lists more aggressively than most, so the re-check interval here is
  shorter than the catalogue default.
