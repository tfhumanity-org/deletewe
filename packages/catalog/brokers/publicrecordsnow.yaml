# PublicRecordsNow
#
# UNVERIFIED. Authored from public opt-out documentation; never executed
# against the live site. Treat every selector as theoretical until someone
# runs it and sets `verified_at`. See docs/broker-catalog.md section 6.

id: publicrecordsnow
name: "PublicRecordsNow"
homepage: https://www.publicrecordsnow.com
version: 1.0.0
category: public_records
jurisdictions:
  - US
hosts:
  - www.publicrecordsnow.com
  - publicrecordsnow.com

automation:
  level: assisted
  reason: "CAPTCHA on the opt-out form"

search:
  method: url_template
  url_template: "https://www.publicrecordsnow.com/name/{name_slug}"
  result_selector: ".person-card"
  fields:
    name: { selector: ".person-name", attr: text }
    locality: { selector: ".person-location", attr: text }
    region: { selector: ".person-region", attr: text }
    age: { selector: ".person-age", attr: text }
    url: { selector: "a.person-link", attr: href }

match:
  fields:
    name: 0.4
    locality: 0.2
    region: 0.15
    age: 0.25
  thresholds:
    review: 0.5
    auto_confirm: 0.92
  require_manual_confirmation: false

opt_out:
  method: form
  url: https://www.publicrecordsnow.com/optout
  required_fields:
    - listing_url
    - email
  steps:
    - id: open
      action: goto
      url: "https://www.publicrecordsnow.com/optout"
      expect: { selector_present: "form" }
    - id: listing-url
      action: fill
      selector: "input[name=\"url\"]"
      value: "{{listing_url}}"
    - id: email
      action: fill
      selector: "input[name=\"email\"]"
      value: "{{email}}"
    - id: captcha
      action: handoff
      reason: "captcha"
      instructions: >-
        Open the link below. The listing URL and email address are already
        filled in for you — paste them if the page is blank, complete the "I am
        not a robot" challenge, and press submit. We do not solve these for you,
        by design.
      url: "https://www.publicrecordsnow.com/optout"

verification:
  method: email_link
  expected_senders:
    - "@publicrecordsnow.com"
  link_pattern: "https://www\\.publicrecordsnow\\.com/[A-Za-z0-9_/-]*(?:confirm|optout|removal|opt-out)[A-Za-z0-9_/-]*"
  window_hours: 24

relist:
  interval_days: 90

rate_limit:
  max_concurrent: 1
  min_interval_ms: 4000
  daily_cap: 200

references:
  - https://www.publicrecordsnow.com/optout
